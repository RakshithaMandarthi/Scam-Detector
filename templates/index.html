<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f2027">
  <title>Scam Detector</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- Google Identity Services (used by "Continue with Google") -->
  <script src="https://accounts.google.com/gsi/client" async defer
          onload="window.__gisReady = true; if (window.initGoogle) window.initGoogle();"></script>
</head>
<body>

<div class="orbs" aria-hidden="true"><span></span><span></span></div>

<!-- Language + logout (always visible) -->
<div class="topbar">
  <select id="lang" class="select-sm" data-i18n-aria="aria.lang" aria-label="Language">
    <option value="en">EN</option>
    <option value="kn">KN</option>
    <option value="hi">HI</option>
  </select>
  <button type="button" id="logoutBtn" class="btn btn-ghost btn-sm hidden" data-i18n="logout">Logout</button>
</div>

<!-- ============ AUTH ============ -->
<main id="auth-view" class="view">
  <div class="card">
    <div class="logo"><span class="logo-icon" aria-hidden="true">🛡️</span><span>Scam Detector</span></div>

    <!-- Login -->
    <section id="panel-login" class="panel">
      <h1 data-i18n="login.welcome">Welcome back</h1>
      <p class="subtitle" data-i18n="login.subtitle"></p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginId" data-i18n="field.identifier"></label>
          <input id="loginId" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
        </div>
        <div class="field">
          <label for="loginPass" data-i18n="field.password"></label>
          <div class="pass-wrap">
            <input id="loginPass" type="password" autocomplete="current-password">
            <button type="button" class="eye" data-toggle="loginPass">👁️</button>
          </div>
        </div>

        <div class="row-between">
          <label class="check"><input type="checkbox" id="remember"><span data-i18n="login.remember"></span></label>
          <button type="button" class="link-btn" data-go="forgot" data-i18n="login.forgot"></button>
        </div>

        <p id="loginMsg" class="msg" role="alert"></p>
        <button type="submit" class="btn btn-primary" data-i18n="login.btn"></button>
      </form>

      <div class="divider"><span data-i18n="or"></span></div>

      <div class="google-area">
        <div id="googleSlot" class="google-slot"></div>
        <button type="button" id="googleFallback" class="btn btn-google">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          <span data-i18n="google"></span>
        </button>
      </div>

      <p class="switch"><span data-i18n="login.noAccount"></span> <button type="button" class="link-btn" data-go="register" data-i18n="login.createLink"></button></p>
    </section>

    <!-- Register -->
    <section id="panel-register" class="panel hidden">
      <h1 data-i18n="register.title"></h1>
      <p class="subtitle" data-i18n="register.subtitle"></p>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="regUser" data-i18n="field.username"></label>
          <input id="regUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20">
        </div>
        <div class="field">
          <label for="regEmail" data-i18n="field.email"></label>
          <input id="regEmail" type="email" autocomplete="email" autocapitalize="none" spellcheck="false">
        </div>
        <div class="field">
          <label for="regPass" data-i18n="field.password"></label>
          <div class="pass-wrap">
            <input id="regPass" type="password" autocomplete="new-password" aria-describedby="passHint">
            <button type="button" class="eye" data-toggle="regPass">👁️</button>
          </div>
          <div class="strength" aria-hidden="true"><span id="strengthBar"></span></div>
          <small id="passHint" class="hint"><span id="strengthLabel"></span> <span data-i18n="hint.password"></span></small>
        </div>
        <div class="field">
          <label for="regConfirm" data-i18n="field.confirm"></label>
          <div class="pass-wrap">
            <input id="regConfirm" type="password" autocomplete="new-password">
            <button type="button" class="eye" data-toggle="regConfirm">👁️</button>
          </div>
        </div>

        <p id="registerMsg" class="msg" role="alert"></p>
        <button type="submit" class="btn btn-primary" data-i18n="register.btn"></button>
      </form>

      <p class="switch"><span data-i18n="register.haveAccount"></span> <button type="button" class="link-btn" data-go="login" data-i18n="register.loginLink"></button></p>
    </section>

    <!-- Forgot password -->
    <section id="panel-forgot" class="panel hidden">
      <h1 data-i18n="forgot.title"></h1>
      <p class="subtitle" data-i18n="forgot.subtitle"></p>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="forgotEmail" data-i18n="field.email"></label>
          <input id="forgotEmail" type="email" autocomplete="email" autocapitalize="none" spellcheck="false">
        </div>
        <p id="forgotMsg" class="msg" role="alert"></p>
        <button type="submit" class="btn btn-primary" data-i18n="forgot.btn"></button>
      </form>

      <p class="switch"><button type="button" class="link-btn" data-go="login" data-i18n="back"></button></p>
    </section>

    <!-- Reset password (opened from the e-mailed link: /?reset=TOKEN) -->
    <section id="panel-reset" class="panel hidden">
      <h1 data-i18n="reset.title"></h1>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="resetPass" data-i18n="field.newpass"></label>
          <div class="pass-wrap">
            <input id="resetPass" type="password" autocomplete="new-password">
            <button type="button" class="eye" data-toggle="resetPass">👁️</button>
          </div>
          <small class="hint" data-i18n="hint.password"></small>
        </div>
        <div class="field">
          <label for="resetConfirm" data-i18n="field.confirm"></label>
          <div class="pass-wrap">
            <input id="resetConfirm" type="password" autocomplete="new-password">
            <button type="button" class="eye" data-toggle="resetConfirm">👁️</button>
          </div>
        </div>
        <p id="resetMsg" class="msg" role="alert"></p>
        <button type="submit" class="btn btn-primary" data-i18n="reset.btn"></button>
      </form>

      <p class="switch"><button type="button" class="link-btn" data-go="login" data-i18n="back"></button></p>
    </section>
  </div>
</main>

<!-- ============ APP ============ -->
<main id="app-view" class="view hidden">
  <div class="card card-wide">
    <header class="app-head">
      <div class="logo logo-sm"><span class="logo-icon" aria-hidden="true">🛡️</span><span>Scam Detector</span></div>
      <p id="greeting" class="greeting"></p>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" role="tab" class="tab-btn active" data-tab="analyze" aria-selected="true"><span aria-hidden="true">🔍</span> <span data-i18n="tab.analyze"></span></button>
      <button type="button" role="tab" class="tab-btn" data-tab="history" aria-selected="false"><span aria-hidden="true">🕘</span> <span data-i18n="tab.history"></span></button>
      <button type="button" role="tab" class="tab-btn" data-tab="dashboard" aria-selected="false"><span aria-hidden="true">📊</span> <span data-i18n="tab.dashboard"></span></button>
    </nav>

    <!-- Analyze -->
    <section id="tab-analyze" class="tab" role="tabpanel">
      <label for="message" data-i18n="analyze.label"></label>
      <textarea id="message" rows="5" maxlength="5000" data-i18n-placeholder="analyze.placeholder"></textarea>
      <p id="liveWarn" class="warn" role="status"></p>

      <div class="samples">
        <span data-i18n="samples"></span>
        <button type="button" class="chip" data-sample="safe" data-i18n="sample.safe"></button>
        <button type="button" class="chip" data-sample="suspicious" data-i18n="sample.suspicious"></button>
        <button type="button" class="chip" data-sample="scam" data-i18n="sample.scam"></button>
        <button type="button" class="chip" data-sample="phish" data-i18n="sample.phish"></button>
      </div>

      <div class="row">
        <button type="button" id="analyzeBtn" class="btn btn-primary" data-i18n="analyze.btn"></button>
        <button type="button" id="clearBtn" class="btn btn-ghost" data-i18n="clear"></button>
      </div>
      <p id="analyzeMsg" class="msg" role="alert"></p>

      <div id="result" class="result hidden" aria-live="polite">
        <div class="result-head">
          <div id="gauge" class="gauge"><span id="gaugeValue" class="gauge-value">0%</span></div>
          <div>
            <p class="muted" data-i18n="risk"></p>
            <h2 class="verdict"><span id="verdictIcon" aria-hidden="true"></span> <span id="verdictLabel"></span></h2>
          </div>
        </div>
        <p id="advice" class="advice"></p>

        <h3 data-i18n="reasons.title"></h3>
        <ul id="reasonList" class="reasons"></ul>

        <div id="urlBlock" class="hidden">
          <h3 data-i18n="urls.title"></h3>
          <ul id="urlList" class="urls"></ul>
        </div>
      </div>
    </section>

    <!-- History -->
    <section id="tab-history" class="tab hidden" role="tabpanel">
      <div class="section-head">
        <h2 data-i18n="history.title"></h2>
        <button type="button" id="clearHistory" class="btn btn-ghost btn-sm hidden" data-i18n="history.clear"></button>
      </div>
      <p id="historyEmpty" class="empty hidden" data-i18n="history.empty"></p>
      <div id="historyList" class="history"></div>
    </section>

    <!-- Dashboard -->
    <section id="tab-dashboard" class="tab hidden" role="tabpanel">
      <h2 data-i18n="dash.title"></h2>
      <div class="stats">
        <div class="stat"><span id="statTotal" class="stat-num">0</span><span class="muted" data-i18n="dash.total"></span></div>
        <div class="stat"><span id="statAvg" class="stat-num">0%</span><span class="muted" data-i18n="dash.avg"></span></div>
      </div>

      <h3 data-i18n="dash.breakdown"></h3>
      <div class="bars">
        <div class="bar-row v-safe">
          <span class="bar-name" data-i18n="verdict.safe"></span>
          <div class="bar-track"><div id="bar-safe" class="bar-fill"></div></div>
          <span id="count-safe" class="bar-count">0</span>
        </div>
        <div class="bar-row v-suspicious">
          <span class="bar-name" data-i18n="verdict.suspicious"></span>
          <div class="bar-track"><div id="bar-suspicious" class="bar-fill"></div></div>
          <span id="count-suspicious" class="bar-count">0</span>
        </div>
        <div class="bar-row v-scam">
          <span class="bar-name" data-i18n="verdict.scam"></span>
          <div class="bar-track"><div id="bar-scam" class="bar-fill"></div></div>
          <span id="count-scam" class="bar-count">0</span>
        </div>
      </div>
    </section>
  </div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/static/js/i18n.js" defer></script>
<script src="/static/js/detector.js" defer></script>
<script src="/static/js/app.js" defer></script>
</body>
</html>
